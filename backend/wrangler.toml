name = "ai-sellerpilot-v4-api"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# Deploy only after Access, Gemini free-tier configuration and owner approval.
# No public routes or custom domains configured.
[vars]
AI_ENABLED = "false"
PER_USER_DAILY_LIMIT = "2"
GLOBAL_DAILY_LIMIT = "20"
MIN_INTERVAL_MS = "5000"
# Set GEMINI_MODEL in the Cloudflare dashboard to a model ID that Google's official pricing page lists as free tier
# (checked 9 Nov 2026: Flash and Flash-Lite 3.x models; gemini-2.5-flash was NOT listed). Empty = AI stays disabled.
# Free-tier content may be used by Google to improve its products; do not send confidential data.
GEMINI_MODEL = ""
# Configure ACCESS_TEAM_DOMAIN, ACCESS_AUD, ALLOWED_ORIGIN in the Cloudflare dashboard.
# Store GEMINI_API_KEY using encrypted Worker secrets only.

[[durable_objects.bindings]]
name = "QUOTA_GATE"
class_name = "QuotaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaGate"]
