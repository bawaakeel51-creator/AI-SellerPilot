name = "ai-sellerpilot-v4-api"
main = "worker.mjs"
compatibility_date = "2026-11-07"
preview_urls = false
keep_vars = true

# Preserve the existing dashboard rate limiter and observability settings.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[build]
command = "node build-studio.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Deploy only after Access, Gemini free-tier configuration and owner approval.
# No public routes or custom domains configured.
[vars]
AI_ENABLED = "false"
AUTH_MODE = "google"
# GOOGLE_CLIENT_ID, GOOGLE_ALLOWED_EMAILS and ALLOWED_ORIGIN are dashboard vars.
# Missing configuration fails closed. Use owner-only approved emails initially.
PER_USER_DAILY_LIMIT = "2"
GLOBAL_DAILY_LIMIT = "20"
MIN_INTERVAL_MS = "5000"
# Candidate model verified on Google's official Gemini pricing page, 2026-11-10.
# Free tier requires an unbilled project; real generation remains unverified.
# AI_ENABLED stays false until Access and live security/provider checks pass.
# Free-tier content may be used by Google to improve its products.
GEMINI_MODEL = "gemini-3.6-flash"
# Configure ACCESS_TEAM_DOMAIN, ACCESS_AUD, ALLOWED_ORIGIN in the Cloudflare dashboard.
# Store GEMINI_API_KEY using encrypted Worker secrets only.

[[durable_objects.bindings]]
name = "QUOTA_GATE"
class_name = "QuotaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaGate"]
