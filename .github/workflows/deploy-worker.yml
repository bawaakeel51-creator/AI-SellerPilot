name: Deploy disabled SellerPilot Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'listing.html'
      - 'listing.js'
      - '.github/workflows/deploy-worker.yml'
permissions:
  contents: read
concurrency:
  group: sellerpilot-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sellerpilot-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all regression tests
        run: node --test test.cjs workspace.test.cjs listing-ai.test.cjs backend/*.test.mjs
      - run: git diff --check
      - name: Require deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy with AI disabled
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '31f66f310534317abc5115b74840e355'
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.159.0 deploy --var AI_ENABLED:false
