name: SellerPilot tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: runzumi-ubuntu-24.04-x64-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test.cjs workspace.test.cjs
      - run: git diff --check
