<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SellerPilot responsive QA</title><style>body{font:16px system-ui;background:#e8edf4;color:#172133;margin:24px}label{display:inline-block;margin:12px}button,select{font:inherit;padding:8px}iframe{display:block;height:850px;border:1px solid #52627a;background:#0b1220;max-width:none}#status{white-space:pre-wrap}main{overflow:auto}</style></head><body><h1>Responsive QA preview</h1><p>Development check: the app below runs at the selected CSS viewport width. This does not emulate a physical mobile device.</p><label>Page<select id="page"><option value="listing.html">Listing Studio</option><option value="workspace.html">Evidence workspace</option><option value="index.html">Profit calculator</option></select></label><label>Viewport width<select id="width"><option>360</option><option>390</option><option>768</option><option>1280</option></select></label><button id="check">Check layout</button><pre id="status" role="status"></pre><main><iframe id="preview" title="App viewport" src="listing.html" width="360"></iframe></main><script>const frame=document.getElementById('preview');function check(){const d=frame.contentDocument;document.getElementById('status').textContent=`Viewport: ${d.documentElement.clientWidth}px\nContent: ${d.documentElement.scrollWidth}px\nHorizontal overflow: ${d.documentElement.scrollWidth>d.documentElement.clientWidth?'FAIL':'PASS'}`;}document.getElementById('page').onchange=e=>{frame.src=e.target.value;};document.getElementById('width').onchange=e=>{frame.width=e.target.value;requestAnimationFrame(check);};document.getElementById('check').onclick=check;frame.onload=check;</script></body></html>
